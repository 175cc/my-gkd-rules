name: build_release

'on':
  workflow_dispatch:

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: gkd-subscription
          path: dist
